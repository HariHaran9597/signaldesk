name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install uv==0.9.3
      - run: uv sync --frozen --group dev
      - run: uv run python -m backend.migrate
      - run: uv run pytest -q
  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run build:demo
        env:
          VITE_DEMO_MODE: 'true'
          VITE_BASE_PATH: /signaldesk/
  containers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Create a local-only container environment
        run: |
          printf 'POSTGRES_PASSWORD=ci-local-only-not-a-secret\nINFERENCE_PROVIDER=evidence\n' > .env
      - name: Build and start the Compose stack
        run: docker compose up -d --build
      - name: Verify PostgreSQL migrations and read-only public mode
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null; then break; fi
            sleep 2
          done
          python - <<'PY'
          import json
          from urllib.request import urlopen

          def get_json(path):
              with urlopen(f"http://127.0.0.1:8080{path}", timeout=5) as response:
                  raw = response.read().decode("utf-8")
              try:
                  return json.loads(raw)
              except json.JSONDecodeError as exc:
                  raise SystemExit(f"{path} returned non-JSON: {raw[:300]!r}") from exc

          health = get_json("/health")
          assert health.get("status") == "ok", f"Unexpected health response: {health!r}"
          capabilities = get_json("/api/capabilities")
          assert capabilities.get("public_demo") is True, capabilities
          assert capabilities.get("draft_generation") is False, capabilities
          assert capabilities.get("draft_queue") is False, capabilities
          assert capabilities.get("local_x_intake") is False, capabilities
          drafts = get_json("/api/drafts")
          assert drafts.get("drafts") == [], drafts
          print("PostgreSQL migrations, API health, and read-only public mode verified.")
          PY
      - name: Stop containers and remove the temporary database
        if: always()
        run: docker compose down -v
